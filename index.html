<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>צ׳אט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF0EA;
    --panel: #E3E7DE;
    --panel-hover: #D8DED2;
    --line: #C7CEBE;
    --text: #20241F;
    --text-soft: #5B6357;
    --accent: #3C5A46;
    --accent-soft: #DDE6DA;
    --user-bubble: #3C5A46;
    --user-bubble-text: #F3F5EF;
    --bot-bubble: #FFFFFF;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Heebo', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 270px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
  }

  .new-chat-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 11px 14px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 16px;
    transition: background .15s ease;
  }
  .new-chat-btn:hover { background: #324c3b; }

  #conversation-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .conv-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conv-item:hover { background: var(--panel-hover); }
  .conv-item.active {
    background: var(--accent-soft);
    color: var(--text);
    font-weight: 500;
  }
  .conv-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conv-delete {
    opacity: 0;
    background: none;
    border: none;
    color: var(--text-soft);
    cursor: pointer;
    font-size: 15px;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .conv-item:hover .conv-delete { opacity: 0.7; }
  .conv-delete:hover { opacity: 1 !important; color: #8a3b3b; }

  .sidebar-footer {
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--text-soft);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .model-select {
    flex: 1;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--text);
  }

  /* ---------- Main chat area ---------- */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 32px 0 12px;
  }

  #messages-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .empty-state {
    max-width: 480px;
    margin: 12vh auto 0;
    text-align: center;
    color: var(--text-soft);
  }
  .empty-state h1 {
    font-size: 26px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 8px;
  }
  .empty-state p {
    font-size: 14.5px;
    line-height: 1.6;
    margin: 0;
  }

  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-start; }
  .msg-row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 100%;
    padding: 13px 16px;
    border-radius: var(--radius);
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-bubble-text);
    border-radius: var(--radius) var(--radius) 2px var(--radius);
    margin-inline-start: auto;
  }
  .msg-row.assistant .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: var(--radius) var(--radius) var(--radius) 2px;
  }

  .msg-row.assistant .bubble.loading {
    color: var(--text-soft);
    font-style: normal;
  }
  .dots span {
    display: inline-block;
    width: 5px; height: 5px;
    margin-inline-end: 3px;
    background: var(--text-soft);
    border-radius: 50%;
    animation: blink 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .error-note {
    font-size: 13px;
    color: #8a3b3b;
    background: #F6E9E9;
    border: 1px solid #E3C6C6;
    border-radius: 8px;
    padding: 8px 12px;
    max-width: 720px;
    margin: 0 auto;
  }

  /* ---------- Input area ---------- */
  #input-area {
    padding: 14px 24px 22px;
  }
  #input-form {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 8px 10px;
  }
  #input-form:focus-within {
    border-color: var(--accent);
  }
  #text-input {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    max-height: 160px;
    padding: 8px 6px;
    background: transparent;
    color: var(--text);
  }
  #send-btn {
    background: var(--accent);
    border: none;
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 9px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .15s ease;
  }
  #send-btn:hover { background: #324c3b; }
  #send-btn:disabled { background: #A9B6A4; cursor: default; }

  .hint {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-soft);
    margin-top: 8px;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>

  <div id="sidebar">
    <button class="new-chat-btn" id="new-chat-btn">
      <span>שיחה חדשה</span>
      <span>+</span>
    </button>
    <div id="conversation-list"></div>
    <div class="sidebar-footer">
      <span>מודל</span>
      <select class="model-select" id="model-select">
        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
      </select>
    </div>
  </div>

  <div id="main">
    <div id="messages">
      <div id="messages-inner"></div>
    </div>
    <div id="input-area">
      <form id="input-form">
        <textarea id="text-input" rows="1" placeholder="כתוב הודעה..."></textarea>
        <button type="submit" id="send-btn" aria-label="שלח">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 19V5M12 5L6 11M12 5L18 11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
      <div class="hint">המודל עלול לטעות. כדאי לבדוק מידע חשוב.</div>
    </div>
  </div>

<script>
(function () {
  const STORAGE_KEY = 'gemini_chat_conversations_v1';

  let conversations = loadConversations();
  let activeId = conversations.length ? conversations[0].id : null;

  const listEl = document.getElementById('conversation-list');
  const messagesInner = document.getElementById('messages-inner');
  const messagesWrap = document.getElementById('messages');
  const form = document.getElementById('input-form');
  const input = document.getElementById('text-input');
  const sendBtn = document.getElementById('send-btn');
  const modelSelect = document.getElementById('model-select');
  const newChatBtn = document.getElementById('new-chat-btn');

  function loadConversations() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveConversations() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
    } catch (e) {
      console.error('Storage save failed', e);
    }
  }

  function createConversation() {
    const conv = {
      id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      title: 'שיחה חדשה',
      messages: [],
      model: modelSelect.value,
      createdAt: Date.now(),
    };
    conversations.unshift(conv);
    activeId = conv.id;
    saveConversations();
    renderSidebar();
    renderMessages();
    input.focus();
  }

  function getActive() {
    return conversations.find((c) => c.id === activeId) || null;
  }

  function deleteConversation(id, evt) {
    evt.stopPropagation();
    conversations = conversations.filter((c) => c.id !== id);
    if (activeId === id) {
      activeId = conversations.length ? conversations[0].id : null;
    }
    saveConversations();
    renderSidebar();
    renderMessages();
  }

  function selectConversation(id) {
    activeId = id;
    const conv = getActive();
    if (conv) modelSelect.value = conv.model || 'gemini-2.5-flash';
    renderSidebar();
    renderMessages();
  }

  function renderSidebar() {
    listEl.innerHTML = '';
    conversations.forEach((conv) => {
      const item = document.createElement('div');
      item.className = 'conv-item' + (conv.id === activeId ? ' active' : '');
      item.onclick = () => selectConversation(conv.id);

      const title = document.createElement('span');
      title.className = 'conv-title';
      title.textContent = conv.title || 'שיחה חדשה';

      const del = document.createElement('button');
      del.className = 'conv-delete';
      del.innerHTML = '✕';
      del.onclick = (e) => deleteConversation(conv.id, e);

      item.appendChild(title);
      item.appendChild(del);
      listEl.appendChild(item);
    });
  }

  function renderMessages() {
    const conv = getActive();
    messagesInner.innerHTML = '';

    if (!conv || conv.messages.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = '<h1>איך אפשר לעזור?</h1><p>כתוב הודעה כדי להתחיל שיחה. כל השיחות נשמרות אוטומטית בדפדפן שלך.</p>';
      messagesInner.appendChild(empty);
      return;
    }

    conv.messages.forEach((m) => {
      const row = document.createElement('div');
      row.className = 'msg-row ' + m.role;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = m.content;
      row.appendChild(bubble);
      messagesInner.appendChild(row);
    });

    scrollToBottom();
  }

  function scrollToBottom() {
    messagesWrap.scrollTop = messagesWrap.scrollHeight;
  }

  function addLoadingBubble() {
    const row = document.createElement('div');
    row.className = 'msg-row assistant';
    row.id = 'loading-row';
    const bubble = document.createElement('div');
    bubble.className = 'bubble loading';
    bubble.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
    row.appendChild(bubble);
    messagesInner.appendChild(row);
    scrollToBottom();
  }

  function removeLoadingBubble() {
    const row = document.getElementById('loading-row');
    if (row) row.remove();
  }

  function addErrorNote(text) {
    const note = document.createElement('div');
    note.className = 'error-note';
    note.textContent = text;
    messagesInner.appendChild(note);
    scrollToBottom();
  }

  async function sendMessage(text) {
    let conv = getActive();
    if (!conv) {
      createConversation();
      conv = getActive();
    }

    conv.messages.push({ role: 'user', content: text });
    if (conv.messages.length === 1) {
      conv.title = text.slice(0, 40);
    }
    conv.model = modelSelect.value;
    saveConversations();
    renderSidebar();
    renderMessages();

    sendBtn.disabled = true;
    addLoadingBubble();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: conv.messages,
          model: conv.model,
        }),
      });

      const data = await res.json();
      removeLoadingBubble();

      if (!res.ok || data.error) {
        addErrorNote(data.error || 'שגיאה בפנייה למודל.');
      } else {
        conv.messages.push({ role: 'assistant', content: data.reply });
        saveConversations();
        renderMessages();
      }
    } catch (err) {
      removeLoadingBubble();
      addErrorNote('שגיאת רשת: ' + err.message);
    } finally {
      sendBtn.disabled = false;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    sendMessage(text);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });

  newChatBtn.addEventListener('click', createConversation);

  // Init
  if (conversations.length === 0) {
    createConversation();
  } else {
    renderSidebar();
    renderMessages();
    const conv = getActive();
    if (conv) modelSelect.value = conv.model || 'gemini-2.5-flash';
  }
})();
</script>
</body>
</html>
